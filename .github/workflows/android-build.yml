
name: Build NO QUIT 3.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project
        id: project
        shell: bash
        run: |
          echo "Searching for Android project..."

          GRADLE_FILE=$(find . -type f \( -name "gradlew" -o -name "gradlew.bat" \) \
            -not -path "*/.gradle/*" | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: Gradle wrapper not found"
            find . -maxdepth 5 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Found project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x "${{ steps.project.outputs.project_dir }}/gradlew"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NO-QUIT-3.0-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
