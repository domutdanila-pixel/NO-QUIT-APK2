
name: Build NO QUIT APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          ARCHIVE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          test -n "$ARCHIVE"
          mkdir project
          unzip -q "$ARCHIVE" -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project/NO_QUIT_2.0/android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NO-QUIT-debug-apk
          path: project/NO_QUIT_2.0/android/app/build/outputs/apk/debug/app-debug.apk
